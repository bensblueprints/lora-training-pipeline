## Architecture

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" style="background:#0d1117;border-radius:8px">
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#c9d1d9" font-size="16" font-weight="bold" font-family="sans-serif">🚀 LoRA Training Pipeline</text>

  <!-- Phase 1: Dataset Creation -->
  <rect x="20" y="50" width="860" height="190" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="40" y="75" fill="#58a6ff" font-size="13" font-weight="bold" font-family="sans-serif">PHASE 1 — Dataset Creation (FLUX Kontext)</text>

  <!-- Input -->
  <rect x="50" y="95" width="140" height="55" rx="6" fill="#1a1f2e" stroke="#30363d"/>
  <text x="120" y="117" text-anchor="middle" fill="#f0883e" font-size="12" font-family="sans-serif">📁 cast_faces/</text>
  <text x="120" y="137" text-anchor="middle" fill="#8b949e" font-size="11" font-family="sans-serif">Reference face</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="122" x2="250" y2="122" stroke="#30363d" stroke-width="2"/>
  <polygon points="248,117 258,122 248,127" fill="#30363d"/>

  <!-- Kontext -->
  <rect x="260" y="90" width="220" height="65" rx="6" fill="#1a1f2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="370" y="112" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold" font-family="sans-serif">FluxKontextPipeline</text>
  <text x="370" y="130" text-anchor="middle" fill="#8b949e" font-size="11" font-family="sans-serif">bfloat16 + sequential CPU offload</text>
  <text x="370" y="145" text-anchor="middle" fill="#6e7681" font-size="10" font-family="sans-serif">Peak VRAM: ~20GB / 24GB</text>

  <!-- Arrow 2 -->
  <line x1="480" y1="122" x2="550" y2="122" stroke="#30363d" stroke-width="2"/>
  <polygon points="548,117 558,122 548,127" fill="#30363d"/>

  <!-- Output -->
  <rect x="560" y="95" width="190" height="55" rx="6" fill="#1a1f2e" stroke="#30363d"/>
  <text x="655" y="117" text-anchor="middle" fill="#3fb950" font-size="12" font-family="sans-serif">📁 lora_kontext/</text>
  <text x="655" y="137" text-anchor="middle" fill="#8b949e" font-size="11" font-family="sans-serif">20 images per character</text>

  <!-- Stats bar -->
  <rect x="50" y="165" width="800" height="55" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="80" y="187" fill="#8b949e" font-size="11" font-family="sans-serif">87 characters</text>
  <text x="250" y="187" fill="#8b949e" font-size="11" font-family="sans-serif">× 20 angles each</text>
  <text x="440" y="187" fill="#8b949e" font-size="11" font-family="sans-serif">= 1,740 images</text>
  <text x="620" y="187" fill="#8b949e" font-size="11" font-family="sans-serif">~5 min/image</text>
  <text x="760" y="187" fill="#8b949e" font-size="11" font-family="sans-serif">~145 hours</text>

  <!-- Phase 2: Quality Gate -->
  <rect x="20" y="255" width="860" height="160" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="40" y="280" fill="#f0883e" font-size="13" font-weight="bold" font-family="sans-serif">PHASE 2 — Quality Gate (ArcFace)</text>

  <rect x="50" y="300" width="160" height="50" rx="6" fill="#1a1f2e" stroke="#30363d"/>
  <text x="130" y="322" text-anchor="middle" fill="#f0883e" font-size="12" font-family="sans-serif">📁 lora_kontext/</text>
  <text x="130" y="340" text-anchor="middle" fill="#8b949e" font-size="10" font-family="sans-serif">20 images</text>

  <line x1="210" y1="325" x2="280" y2="325" stroke="#30363d" stroke-width="2"/>
  <polygon points="278,320 288,325 278,330" fill="#30363d"/>

  <rect x="290" y="300" width="200" height="50" rx="6" fill="#1a1f2e" stroke="#f0883e" stroke-width="1.5"/>
  <text x="390" y="320" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold" font-family="sans-serif">ArcFace (buffalo_l)</text>
  <text x="390" y="340" text-anchor="middle" fill="#8b949e" font-size="10" font-family="sans-serif">Cosine similarity per image pair</text>

  <line x1="490" y1="325" x2="570" y2="325" stroke="#30363d" stroke-width="2"/>
  <polygon points="568,320 578,325 568,330" fill="#30363d"/>

  <rect x="580" y="300" width="200" height="50" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="680" y="320" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold" font-family="sans-serif">GATE ✅</text>
  <text x="680" y="340" text-anchor="middle" fill="#8b949e" font-size="10" font-family="sans-serif">mean ≥ 0.78 | min ≥ 0.65</text>

  <!-- Phase 3: LoRA Training -->
  <rect x="20" y="430" width="860" height="240" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="40" y="455" fill="#3fb950" font-size="13" font-weight="bold" font-family="sans-serif">PHASE 3 — LoRA Training (Krea 2)</text>

  <rect x="50" y="475" width="160" height="50" rx="6" fill="#1a1f2e" stroke="#30363d"/>
  <text x="130" y="497" text-anchor="middle" fill="#f0883e" font-size="12" font-family="sans-serif">📁 lora_kontext/</text>
  <text x="130" y="515" text-anchor="middle" fill="#8b949e" font-size="10" font-family="sans-serif">20 images + captions</text>

  <line x1="210" y1="500" x2="280" y2="500" stroke="#30363d" stroke-width="2"/>
  <polygon points="278,495 288,500 278,505" fill="#30363d"/>

  <rect x="290" y="475" width="220" height="55" rx="6" fill="#1a1f2e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="400" y="497" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold" font-family="sans-serif">Krea 2 turbo (int8)</text>
  <text x="400" y="515" text-anchor="middle" fill="#8b949e" font-size="10" font-family="sans-serif">Rank 16 / Alpha 16 / 2000 steps</text>

  <line x1="510" y1="500" x2="590" y2="500" stroke="#30363d" stroke-width="2"/>
  <polygon points="588,495 598,500 588,505" fill="#30363d"/>

  <rect x="600" y="475" width="180" height="50" rx="6" fill="#1a1f2e" stroke="#30363d"/>
  <text x="690" y="497" text-anchor="middle" fill="#3fb950" font-size="12" font-family="sans-serif">📁 char.safetensors</text>
  <text x="690" y="515" text-anchor="middle" fill="#8b949e" font-size="10" font-family="sans-serif">LoRA weights</text>

  <!-- Stats bar 2 -->
  <rect x="50" y="555" width="800" height="55" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="80" y="580" fill="#8b949e" font-size="11" font-family="sans-serif">ComfyUI Loader: Krea2LoRALoader</text>
  <text x="370" y="580" fill="#8b949e" font-size="11" font-family="sans-serif">Strength: 0.65–0.85</text>
  <text x="580" y="580" fill="#8b949e" font-size="11" font-family="sans-serif">~45-60 min/character</text>
